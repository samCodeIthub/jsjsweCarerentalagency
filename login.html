<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In · weCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=3">
    <link rel="stylesheet" href="client-styles.css?v=3">
    <script type="module" src="firebase-config.js"></script>
  <link rel="icon" type="image/svg+xml" href="logo-mark.svg">
</head>

<body class="client-auth-body">

    <div class="client-auth">
        <div class="client-auth__brand">
            <img class="brand__mark" src="logo-mark.svg" alt="">
            <span class="brand__name">we<b>Care</b></span>
        </div>

        <p style="text-align:center;margin-bottom:-6px"><a href="home.html" style="font-size:13px;color:var(--teal-darkest);text-decoration:none">&larr; Back to home</a></p>

        <div class="client-auth__card">
            <div class="client-auth__tabs" role="tablist">
                <button class="client-auth__tab is-active" id="tabLogin" type="button" role="tab"
                    aria-selected="true">Log In</button>
                <button class="client-auth__tab" id="tabRegister" type="button" role="tab"
                    aria-selected="false">Register</button>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="client-auth__form">
                <p class="client-auth__error" id="loginError"></p>
                <div class="field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com">
                </div>
                <div class="field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button class="btn btn--primary btn--block" type="submit">Log In</button>
                <div class="client-auth__divider"><span>or</span></div>
                <button class="btn btn--google btn--block" id="googleLoginBtn" type="button" style="margin-bottom:0;">
                    <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.1 17.7 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7C43.8 37.7 46.5 31.6 46.5 24.5z"/>
                        <path fill="#FBBC05" d="M10.5 19.4c-.5 1.4-.8 3-.8 4.6s.3 3.2.8 4.6l-7.9 6.1C.9 31.6 0 28.1 0 24s.9-7.6 2.6-10.7z"/>
                        <path fill="#34A853" d="M24 48c6.1 0 11.2-2 15-5.5l-7.3-5.7c-2 1.4-4.7 2.2-7.7 2.2-6.3 0-11.6-3.6-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
                    </svg>
                    Continue with Google
                </button>
            </form>

            <!-- REGISTER FORM (students only) -->
            <form id="registerForm" class="client-auth__form" hidden>
                <p class="client-auth__error" id="registerError"></p>
                <div class="field">
                    <label for="regName">Full name</label>
                    <input type="text" id="regName" required placeholder="e.g. Ama Serwaa">
                </div>
                <div class="field">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required placeholder="you@example.com">
                </div>
                <div class="field">
                    <label for="regPhone">Phone number</label>
                    <input type="tel" id="regPhone" required placeholder="e.g. 024 555 1234">
                </div>
                <div class="field">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required minlength="6" placeholder="At least 6 characters">
                </div>
                <div class="field">
                    <label for="regConfirm">Confirm password</label>
                    <input type="password" id="regConfirm" required minlength="6" placeholder="Re-enter password">
                </div>
                <button class="btn btn--primary btn--block" type="submit">Create Account</button>
                <div class="client-auth__divider"><span>or</span></div>
                <button class="btn btn--google btn--block" id="googleSignupBtn" type="button" style="margin-bottom:0;">
                    <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.6 2.4 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.1 17.7 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7C43.8 37.7 46.5 31.6 46.5 24.5z"/>
                        <path fill="#FBBC05" d="M10.5 19.4c-.5 1.4-.8 3-.8 4.6s.3 3.2.8 4.6l-7.9 6.1C.9 31.6 0 28.1 0 24s.9-7.6 2.6-10.7z"/>
                        <path fill="#34A853" d="M24 48c6.1 0 11.2-2 15-5.5l-7.3-5.7c-2 1.4-4.7 2.2-7.7 2.2-6.3 0-11.6-3.6-13.5-9.9l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/>
                    </svg>
                    Sign up with Google
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="login.js"></script>
    <script>try{sessionStorage.removeItem("wecareIntroSeen");var t=new URLSearchParams(location.search).get("type");if(t==="hostels"||t==="apartments"){sessionStorage.setItem("wecareType",t)}}catch(e){}</script>
</body>

</html>
